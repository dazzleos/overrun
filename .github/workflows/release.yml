# Tests and builds Overrun on every push and pull request. On pushes to the
# default branch it publishes its archive, icon, screenshot and catalogue
# (apps.json) as the "latest" release: one of the sources Dazzle's
# catalogue lists, from which Settings installs and updates Overrun.
name: Release

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push cancels a run, except on the default branch: there it
# may be replacing the latest release, and would leave none.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_name != github.event.repository.default_branch }}

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      # Dazzle beside Overrun, as build.zig.zon has it (../dazzle).
      - uses: actions/checkout@v4
        with:
          path: overrun
      - uses: actions/checkout@v4
        with:
          repository: dazzleos/dazzle
          path: dazzle

      - name: Cache Zig
        uses: actions/cache@v4
        with:
          path: dazzle/build/zig
          key: zig-${{ runner.os }}-${{ hashFiles('dazzle/scripts/zig') }}

      - name: Test
        working-directory: overrun
        run: ../dazzle/scripts/zig build test --summary new

      # Signed with the key Dazzle's apps are (and Settings trusts).
      - name: Build
        working-directory: overrun
        env:
          DAZZLE_SIGNING_KEY: ${{ secrets.DAZZLE_SIGNING_KEY }}
        run: |
          ../dazzle/scripts/zig build
          ls -l zig-out/apps

      # Handed to the publish job (and kept a day: the release keeps
      # them).
      - uses: actions/upload-artifact@v4
        with:
          name: overrun
          path: overrun/zig-out/apps/
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: publish
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: overrun
          path: dist

      # One release, "latest", replaced by each build: Dazzle's catalogue
      # lists its download link, which stays the same.
      - name: Replace the latest release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          short=$(echo "$GITHUB_SHA" | cut -c1-7)
          echo "The latest build of Overrun, from commit $short ($(date -u +%Y-%m-%d)). Install it from Settings, Software, on Dazzle." > notes.md
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest dist/* \
            --target "$GITHUB_SHA" --title "Overrun (latest build, $short)" \
            --notes-file notes.md --latest
